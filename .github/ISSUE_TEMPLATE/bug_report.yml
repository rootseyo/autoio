name: Bug report
description: Report a reproducible AutoIO problem
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AutoIO version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not attach macros containing passwords, tokens, or personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
