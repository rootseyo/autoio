[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoio-macro"
dynamic = ["version"]
description = "A cross-platform keyboard and mouse macro recorder for macOS and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "rootseyo" }]
keywords = ["automation", "keyboard", "macro", "mouse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = [
  "customtkinter>=5.2,<6",
  "pynput>=1.7,<2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]
dev = ["ruff>=0.8,<1"]

[project.gui-scripts]
autoio = "auto_io.__main__:main"

[tool.setuptools.packages.find]
include = ["auto_io*"]

[tool.setuptools.dynamic]
version = { attr = "auto_io.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
